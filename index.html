<script>
//CORE-START
const RHO={L:1.710,M:1.717,H:1.724};
const SS={L:1.725,H:1.739};
const RMIN=1.703,RMAX=1.746;
const MODELS=['semi','cons','disp'];
function predict(model,g,heated){
  const H=RHO.H,L=RHO.L,M=RHO.M,p=Math.pow(2,-g);let b;
  if(!heated){
    if(model==='semi'){
      if(g<=1){const e=Math.pow(2,g);b=[{rho:H,w:(2-e)/e},{rho:M,w:2*(e-1)/e}];}
      else{const h=Math.pow(2,1-g);b=[{rho:M,w:h},{rho:L,w:1-h}];}
    }
    else if(model==='cons') b=[{rho:H,w:p},{rho:L,w:1-p}];
    else b=[{rho:L+(H-L)*p,w:1}];
  }else{
    if(model==='disp') b=[{rho:SS.L+(SS.H-SS.L)*p,w:1}];
    else b=[{rho:SS.H,w:p},{rho:SS.L,w:1-p}];
  }
  return b.filter(x=>x.w>0.001);
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function seedOf(world,g,heated){return (world.charCodeAt(0)*131+Math.round(g*10)*17+(heated?7:3))*2654435761>>>0}
function observe(world,g,heated){
  const r=mulberry32(seedOf(world,g,heated));
  return predict(world,g,heated).map(b=>({rho:b.rho+(r()-.5)*0.0007,w:Math.min(1,Math.max(0.01,b.w+(r()-.5)*0.05))}));
}
function matches(pred,obs){
  const P=pred.filter(b=>b.w>=0.03),O=obs.filter(b=>b.w>=0.03);
  if(P.length!==O.length) return false;
  return P.every(p=>O.some(o=>Math.abs(o.rho-p.rho)<=0.0022&&Math.abs(o.w-p.w)<=0.14));
}
function aliveModels(samples,world){
  return MODELS.filter(m=>samples.every(s=>matches(predict(m,s.gen,s.heated),observe(world,s.gen,s.heated))));
}
function molecules(model,g){
  const n=Math.pow(2,g),seg=(c)=>Array(16).fill(c);
  if(model==='semi'){
    if(g===0) return [[seg('H'),seg('H')]];
    return Array.from({length:n},(_,i)=>i<2?[seg('H'),seg('L')]:[seg('L'),seg('L')]);
  }
  if(model==='cons') return Array.from({length:n},(_,i)=>i===0?[seg('H'),seg('H')]:[seg('L'),seg('L')]);
  const k=Math.round(16*Math.pow(2,-g));
  const st=(shift)=>Array.from({length:16},(_,i)=>{const j=(i+shift)%16;return Math.floor((j+1)*k/16)>Math.floor(j*k/16)?'H':'L'});
  return Array.from({length:n},()=>[st(0),st(8)]);
}
//CORE-END

const WAIT=6000,KEY='ms-lab-ind-v1',LKEY='ms-lab-lang';
const S={lang:'es',mode:null,world:'semi',gen:0,async:false,samples:[],heat:false,mol:'semi',mOpen:false,tOpen:false,quiz:{},openDone:{}};
try{const l=localStorage.getItem(LKEY);if(l==='es'||l==='va')S.lang=l;}catch(e){}
const T=()=>I18N[S.lang];
const P=()=>S.mode==='proj';
const fmtG=(g)=>String(g).replace('.',',');
const fmt=(x)=>x.toFixed(3).replace('.',',');
const pct=(w)=>Math.round(w*100)+' %';
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const descBands=(b)=>b.slice().sort((a,c)=>c.rho-a.rho).map(x=>`${fmt(x.rho)} (${pct(x.w)})`).join(' + ');
const rev=()=>S.samples.filter(x=>x.stage>=4);
const sLabel=(s)=>`G${fmtG(s.gen)} · ${s.heated?T().heated:T().native}`;
const sKey=(s)=>s.gen+'-'+(s.heated?1:0);
const compat=(s)=>MODELS.filter(m=>matches(predict(m,s.gen,s.heated),observe(S.world,s.gen,s.heated)));
const joinY=(arr)=>arr.length<2?arr.join(''):arr.slice(0,-1).join(', ')+(S.lang==='va'?' i ':' y ')+arr[arr.length-1];

function save(){if(S.mode!=='ind')return;try{localStorage.setItem(KEY,JSON.stringify({gen:S.gen,samples:S.samples,heat:S.heat,quiz:S.quiz}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.samples)){S.gen=d.gen||0;S.samples=d.samples;S.heat=!!d.heat;S.quiz=d.quiz||{};}}catch(e){}}
function resetExp(){S.gen=0;S.samples=[];S.heat=false;S.quiz={};S.openDone={};}

function describe(bands,heated,nums){
  const t=T(),R=heated?SS:RHO;
  const items=bands.filter(b=>b.w>=0.03).sort((a,c)=>c.rho-a.rho).map(b=>{
    let p=Math.abs(b.rho-R.L)<0.0015?'L':Math.abs(b.rho-R.H)<0.0015?'H':(b.rho>R.L&&b.rho<R.H)?'mid':'out';
    return t.pos[p]+(nums?` (${fmt(b.rho)} ${t.rho}, ${pct(b.w)})`:'');});
  return t.ariaN(items.length)+': '+items.join('; ');
}

function draw(cv,o){
  const proj=P(),dpr=window.devicePixelRatio||1,W=cv.clientWidth||600,kind=o.kind;
  const H=kind==='strip'?(proj?96:66):kind==='mini'?(proj?80:58):(proj?190:136);
  const fs=proj?20:14;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
  const c=cv.getContext('2d');c.scale(dpr,dpr);
  const pad=10,X=(r)=>pad+(r-RMIN)/(RMAX-RMIN)*(W-2*pad),R=(x)=>RMIN+(x-pad)/(W-2*pad)*(RMAX-RMIN);
  const sh=kind==='mini'?(proj?34:26):(proj?54:42),s=0.00085,bands=o.bands||[],rnd=mulberry32(Math.round(W)+bands.length*7+(o.heated?3:0));
  c.fillStyle='#0b1220';c.fillRect(0,0,W,sh);
  const val=(r)=>bands.reduce((a,b)=>a+b.w*Math.exp(-Math.pow(r-b.rho,2)/(2*s*s)),0);
  for(let x=0;x<W;x++){const v=Math.min(1,Math.sqrt(val(R(x)))+rnd()*0.03);c.fillStyle=`rgba(190,225,255,${v.toFixed(3)})`;c.fillRect(x,0,1,sh);}
  c.fillStyle='#fff';c.fillRect(0,sh,W,H-sh);
  const t=T(),refs=o.heated?[[SS.L,`¹⁴N ${t.mc} 1,725`,'¹⁴N '+t.mc],[SS.H,`¹⁵N ${t.mc} 1,739`,'¹⁵N '+t.mc]]
    :[[RHO.L,'¹⁴N 1,710','¹⁴N'],[RHO.M,t.hyb+' 1,717',''],[RHO.H,'¹⁵N 1,724','¹⁵N']];
  const base=kind==='strip'?sh+10:H-(kind==='mini'?4:fs+8),top=sh+6;
  c.strokeStyle='#C9C3B3';c.setLineDash([4,4]);c.lineWidth=1;
  refs.forEach(([r])=>{c.beginPath();c.moveTo(X(r),0);c.lineTo(X(r),base);c.stroke();});
  c.setLineDash([]);
  c.fillStyle='#1F2A37';c.font=`${fs}px "Atkinson Hyperlegible",Arial,sans-serif`;c.textAlign='center';
  if(kind==='strip'){refs.forEach(([r,,l])=>{if(l)c.fillText(l,X(r),H-6);});}
  else{
    c.beginPath();c.moveTo(pad,base);
    for(let x=pad;x<=W-pad;x++){const v=Math.min(1,val(R(x))+(rnd()-.5)*0.012);c.lineTo(x,base-Math.max(0,v)*(base-top));}
    c.lineTo(W-pad,base);c.closePath();c.fillStyle='rgba(15,118,110,.25)';c.fill();
    c.strokeStyle='#1F2A37';c.lineWidth=1.6;c.stroke();
    if(kind==='full'){c.fillStyle='#1F2A37';refs.forEach(([r,l])=>c.fillText(l,X(r),H-5));}
  }
  (o.marks||[]).forEach((m,k)=>{
    const x=X(m);c.strokeStyle='#F97316';c.lineWidth=2.5;c.setLineDash([5,4]);
    c.beginPath();c.moveTo(x,0);c.lineTo(x,kind==='strip'?sh:base);c.stroke();c.setLineDash([]);
    c.fillStyle='#F97316';c.beginPath();c.moveTo(x,sh+1);c.lineTo(x-7,sh+12);c.lineTo(x+7,sh+12);c.closePath();c.fill();
    if(proj){c.font=`bold ${fs+2}px "Atkinson Hyperlegible",Arial,sans-serif`;c.fillStyle='#FDBA74';c.fillText('ABCDEFGH'[k],x+(x>W-30?-14:14),fs+4);}
  });
}

function procSVG(t){
  let o='';['tube','cscl','cent','cam'].forEach((k,i)=>{const x=10+i*215;
    o+=`<g transform="translate(${x+40},4)">${IC[k]()}</g><text x="${x+100}" y="122" text-anchor="middle" font-size="16" fill="#1F2A37" font-family="inherit">${i+1}. ${t.pf[i]}</text>`;
    if(i<3)o+=`<path d="M${x+170} 50 h28 m-7 -6 l7 6 l-7 6" stroke="#55606E" stroke-width="2.5" fill="none"/>`;});
  return `<svg viewBox="0 0 880 134" width="100%" role="img" aria-label="${t.pf.join(' → ')}">${o}</svg>`;
}
function flaskSVG(t,g){
  const fl=(cx,col,fillc,seed)=>{
    const hw=(y)=>18+(y-45)*(42/75);let dots='';const r=mulberry32(seed);
    for(let i=0;i<14;i++){const y=88+r()*28,w=hw(y)-8,dx=(cx+(r()*2-1)*w).toFixed(1);dots+=`<ellipse cx="${dx}" cy="${y.toFixed(1)}" rx="3.4" ry="1.7" fill="${col}" transform="rotate(${Math.round(r()*180)} ${dx} ${y.toFixed(1)})"/>`;}
    return `<polygon points="${cx-18},10 ${cx+18},10 ${cx+18},45 ${cx+60},120 ${cx-60},120 ${cx-18},45" fill="#fff" stroke="#1F2A37" stroke-width="2.5" stroke-linejoin="round"/><polygon points="${cx-hw(80)},80 ${cx+hw(80)},80 ${cx+60},120 ${cx-60},120" fill="${fillc}" opacity=".85"/>${dots}`;};
  return `<svg viewBox="0 0 560 160" width="100%" style="max-width:${P()?760:560}px" role="img" aria-label="${t.fl[0]} → ${t.fl[1]}">
  ${fl(90,'#7C2D12','#FDBA74',3)}<text x="90" y="145" text-anchor="middle" font-size="16" fill="#1F2A37" font-family="inherit">${t.fl[0]}</text>
  <path d="M170 70 h90 m-9 -7 l9 7 l-9 7" stroke="#55606E" stroke-width="2.5" fill="none"/><text x="215" y="58" text-anchor="middle" font-size="15" fill="#55606E" font-family="inherit">${t.fl[2]}</text>
  ${fl(350,'#134E4A','#5EEAD4',9)}<text x="350" y="145" text-anchor="middle" font-size="16" fill="#1F2A37" font-family="inherit">${t.fl[1]}</text>
  <text x="450" y="80" font-size="30" font-weight="700" fill="#C2410C" font-family="inherit">G${fmtG(g)}</text></svg>`;
}
function molSVG(model,g){
  const mols=molecules(model,g),w=16*3.6,h=14,gap=5;let y=0,out='';
  mols.forEach(m=>{m.forEach((st,si)=>{st.forEach((c,i)=>{
    const x=(i*3.6).toFixed(1),y0=y+(si?8:1);
    out+=c==='H'?`<rect x="${x}" y="${y0}" width="3.3" height="5" fill="#C2410C" stroke="#1F2A37" stroke-width=".7"/>`
      :`<rect x="${x}" y="${(y0+1.3).toFixed(1)}" width="3.3" height="2.4" fill="#0F766E"/>`;});});y+=h+gap;});
  return `<svg width="${w.toFixed(0)}" height="${y}" viewBox="0 0 ${w.toFixed(0)} ${y}" role="img" aria-label="G${g}">${out}</svg>`;
}

function conclusion(){
  const t=T(),alive=aliveModels(rev(),S.world),dead=MODELS.filter(m=>!alive.includes(m));
  let h='',cls='concl';
  const reasons=dead.map(m=>{
    const s=rev().find(s=>!matches(predict(m,s.gen,s.heated),observe(S.world,s.gen,s.heated)));
    return '<li>'+t.killed(sLabel(s),t.names[m],descBands(predict(m,s.gen,s.heated)),descBands(observe(S.world,s.gen,s.heated)))+'</li>';
  }).join('');
  if(!dead.length) h='<p>'+t.c0+'</p>';
  else if(alive.length===1){cls+=' win';h='<ul>'+reasons+'</ul><p>'+t.win[alive[0]]+'</p><p class="note">'+t.caution+'</p>';}
  else if(alive.length===2){
    const k=alive.slice().sort().join('');
    h='<ul>'+reasons+'</ul><p>'+t.cPair(t.names[alive[0]],t.names[alive[1]])+' '+(k==='dispsemi'?t.hintSD:k==='conssemi'?t.hintSC:t.hintCD)+'</p>';
  }else h='<ul>'+reasons+'</ul>';
  return `<div class="${cls}" role="status" aria-live="polite">${h}</div>`;
}

function waitLeft(s){return S.mode==='ind'&&s.stage===0?Math.max(0,Math.ceil((WAIT-(Date.now()-s.t0))/1000)):0;}
function gate(s){
  const t=T();if(P())return {dis:false,msg:''};
  if(s.stage===0){const r=waitLeft(s);if(r>0)return {dis:true,msg:t.wait(r)};if(!s.marks.length)return {dis:true,msg:t.needMark};}
  if(s.stage===2&&!s.hyp)return {dis:true,msg:t.needHyp};
  return {dis:false,msg:''};
}

function sampleHTML(s,i){
  const t=T(),ob=observe(S.world,s.gen,s.heated);
  let x=`<div class="row"><span class="lab">${sLabel(s)}</span><button class="btn alt" data-rm="${i}" id="rm${i}">${t.remove}</button></div>`;
  if(s.stage===0)x+=`<p class="note">${t.spinning}</p><canvas class="mk" data-c="${i}" data-kind="strip0" role="img" aria-label="${t.ariaEmpty}"></canvas>`;
  else x+=`<canvas data-c="${i}" data-kind="${s.stage===1?'strip':'full'}" role="img" aria-label="${esc(describe(ob,s.heated,s.stage>=2))}"></canvas>`;
  if(s.stage>=2)x+=`<div class="read">${t.bands}: ${descBands(ob)} ${t.rho}</div>`;
  if(s.stage===2){
    if(P())x+=`<div class="votes"><p><b>${t.voteQ}</b></p><div class="row">`+MODELS.map(m=>`<div class="vote"><span>${t.names[m]}</span><button class="btn alt" id="v${i}${m}m" data-vote="${i}|${m}|-1" aria-label="− ${t.names[m]}">−</button><span class="n">${s.votes[m]}</span><button class="btn alt" id="v${i}${m}p" data-vote="${i}|${m}|1" aria-label="+ ${t.names[m]}">+</button></div>`).join('')+`</div></div>`;
    else x+=`<div class="hyp"><p><b>${t.hypQ}</b></p><div class="row">`+MODELS.map(m=>`<label><input type="radio" name="hyp${i}" id="h${i}${m}" data-i="${i}" value="${m}" ${s.hyp===m?'checked':''}> ${t.names[m]}</label>`).join(' &nbsp; ')+
      `</div><label for="j${i}">${t.hypJ}</label><textarea id="j${i}" data-j="${i}">${esc(s.just||'')}</textarea></div>`;
  }
  if(s.stage>=3)x+=`<div class="preds">`+MODELS.map(m=>{const ok=matches(predict(m,s.gen,s.heated),ob);
    return `<div><b>${t.predOf}: ${t.names[m]}</b> ${s.stage>=4?`<span class="${ok?'ok':'no'}">${ok?t.okTxt:t.noTxt}</span>`:''}<canvas data-p="${i}|${m}" role="img" aria-label="${esc(t.predOf+' '+t.names[m]+': '+describe(predict(m,s.gen,s.heated),s.heated,true))}"></canvas></div>`;}).join('')+`</div>`;
  if(s.stage>=4){
    const cm=compat(s);
    if(P()){
      x+=`<div class="fb fbok">${t.votesRes}: ${MODELS.map(m=>`${t.names[m]} ${s.votes[m]}`).join(' · ')}.<br>${t.compatTxt}: <b>${cm.length?joinY(cm.map(m=>t.names[m])):t.none}</b>.</div>`;
    }else if(s.hyp){
      const ok=cm.includes(s.hyp),others=cm.filter(m=>m!==s.hyp).map(m=>t.names[m]);
      x+=`<div class="fb ${ok?'fbok':'fbno'}">${t.yourHyp(t.names[s.hyp])} ${s.just?`<i>«${esc(s.just)}»</i> `:''}<br>`+
        (ok?t.fbOk+' '+(others.length?t.alsoOk(joinY(others)):t.onlyOk):t.fbNo(descBands(predict(s.hyp,s.gen,s.heated)),descBands(ob)))+`</div>`;
    }
  }
  if(s.stage<4){
    const ic=['cent','dens'][s.stage],g=gate(s);
    const q=s.stage===0?(P()?t.stQ0p:t.stQ0i):t.stQ[s.stage];
    x+=`<div class="row">${ic?`<svg viewBox="0 0 120 92" width="${P()?140:110}" height="${P()?107:84}" aria-hidden="true">${IC[ic]()}</svg>`:''}<div>${q?`<p class="note" style="margin:0 0 8px">${q}</p>`:''}<button class="btn" data-adv="${i}" id="adv${i}" ${g.dis?'disabled':''}>${t.stBtn[s.stage]}</button> <span class="note" id="cd${i}" aria-live="polite">${g.msg}</span></div></div>`;
  }
  if(P()&&s.stage>=4){const k=sKey(s);
    return `<details class="samp" data-k="${k}" ${S.openDone[k]?'open':''}><summary>${sLabel(s)} · ${descBands(ob)} ${t.rho}</summary>${x}</details>`;}
  return `<div class="samp">${x}</div>`;
}

function summaryText(){
  const t=T();
  const lines=rev().map(s=>{const cm=compat(s);
    return `${sLabel(s)} | ${t.colBands}: ${descBands(observe(S.world,s.gen,s.heated))} ${t.rho} | ${t.colHyp}: ${s.hyp?t.names[s.hyp]:'—'}${s.just?' («'+s.just+'»)':''} | ${t.colRes}: ${cm.length?cm.map(m=>t.names[m]).join(', '):t.none}`;});
  const tmp=document.createElement('div');tmp.innerHTML=conclusion();
  return t.sumTitle+'\n\n'+lines.join('\n')+'\n\n'+t.h4+': '+tmp.textContent.replace(/\s+/g,' ').trim();
}

function render(){
  const t=T(),app=document.getElementById('app'),ae=document.activeElement,act=ae&&ae.id,sel=ae&&ae.tagName==='TEXTAREA'?[ae.selectionStart,ae.selectionEnd]:null;
  document.documentElement.lang=S.lang==='va'?'ca':'es';
  document.body.classList.toggle('proj',P());
  let h=`<header><div><h1>${t.title}</h1><p class="sub">${t.sub}</p></div>
  <div class="lang" role="group" aria-label="Idioma"><button id="l-es" class="${S.lang==='es'?'on':''}" data-lang="es">Castellano</button><button id="l-va" class="${S.lang==='va'?'on':''}" data-lang="va">Valencià</button></div></header>`;
  if(!S.mode){
    h+=`<section class="card"><h2>${t.modeQ}</h2><div class="modepick">`+['proj','ind'].map(m=>`<button class="modecard" id="mode-${m}" data-mode="${m}"><b>${t.modes[m].t}</b>${t.modes[m].d}</button>`).join('')+`</div></section>`;
    h+=footer(t);app.innerHTML=h;if(act){const e=document.getElementById(act);if(e)e.focus();}return;
  }
  h+=`<div class="row modebar"><span>${t.modeNow}: <b>${t.modes[S.mode].t}</b></span><button class="btn alt" id="chmode">${t.change}</button><button class="btn alt" id="reset">${t.reset}</button></div>`;
  const alive=aliveModels(rev(),S.world);
  const refs=[{id:'r15',label:t.ctrl15,bands:[{rho:RHO.H,w:1}]},{id:'r14',label:t.ctrl14,bands:[{rho:RHO.L,w:1}]},{id:'rmix',label:t.ctrlMix,bands:[{rho:RHO.H,w:.5},{rho:RHO.L,w:.5}]}];
  const anyHeat=S.heat||S.samples.some(s=>s.heated);
  if(anyHeat)refs.push({id:'s15',label:t.ctrlS15,bands:[{rho:SS.H,w:1}],heated:true},{id:'s14',label:t.ctrlS14,bands:[{rho:SS.L,w:1}],heated:true});
  h+=`<section class="card"><h2>${t.h0}</h2><p>${t.h0p}</p><div class="models">`+MODELS.map(m=>`<div class="model"><h3>${t.names[m]}</h3><p>${t.desc[m]}</p></div>`).join('')+`</div></section>`;
  const step=S.async?0.5:1;
  h+=`<section class="card"><h2>${t.h1}</h2><p>${t.h1p}</p>`+
    (P()?`<div class="row"><label><input type="checkbox" id="async" ${S.async?'checked':''}> ${t.async}</label></div>`:'')+
    `<div class="row"><div class="dots" aria-hidden="true">`+[0,1,2,3,4].map(g=>`<div class="dot ${g<=S.gen?'on':''} ${g===Math.floor(S.gen)?'cur':''}">G${g}</div>`).join('')+`</div><div>${t.gen(S.gen)}</div></div>
    <div>${flaskSVG(t,S.gen)}</div><button class="btn" id="next" ${S.gen>=4?'disabled':''}>${S.gen>=4?t.maxed:t.next(step)}</button></section>`;
  h+=`<section class="card"><h2>${t.h2}</h2><p>${t.h2p}</p>${procSVG(t)}
    <div class="row"><label><input type="checkbox" id="heat" ${S.heat?'checked':''}> ${t.heat}</label></div>
    <div class="row"><button class="btn" id="spin">${t.spin(S.gen)}${S.heat?' · '+t.heated:''}</button></div>`+
    (anyHeat?`<p class="note">${t.ssNote}</p>`:'')+
    refs.map(r=>`<div class="samp"><div class="lab">${r.label}</div><canvas data-ref="${r.id}" role="img" aria-label="${esc(r.label)}"></canvas></div>`).join('')+
    S.samples.map(sampleHTML).join('')+`</section>`;
  h+=`<section class="card"><h2>${t.h3}</h2>`;
  if(!rev().length)h+=`<p>${t.empty}</p>`;
  else h+=`<table><tr><th>${t.colSample}</th>${MODELS.map(m=>`<th>${t.names[m]}</th>`).join('')}</tr>`+
      rev().map(s=>`<tr><td>${sLabel(s)}</td>`+MODELS.map(m=>{const ok=matches(predict(m,s.gen,s.heated),observe(S.world,s.gen,s.heated));return `<td class="${ok?'ok':'no'}">${ok?t.okTxt:t.noTxt}</td>`;}).join('')+`</tr>`).join('')+
      `<tr><th>${t.state}</th>`+MODELS.map(m=>`<th class="${alive.includes(m)?'ok':'no'}">${alive.includes(m)?t.alive:t.dead}</th>`).join('')+`</tr></table>`;
  h+=`</section><section class="card"><h2>${t.h4}</h2>${conclusion()}</section>`;
  h+=`<section class="card" id="mdetcard"><details id="mdet" ${S.mOpen?'open':''}><summary>${t.mdet}</summary><h2 style="margin-top:12px">${t.hm}</h2><p>${t.hmp}</p><div class="row" role="radiogroup">`+
    MODELS.map(m=>`<label><input type="radio" name="mol" id="mol-${m}" value="${m}" ${S.mol===m?'checked':''}> ${t.names[m]}</label>`).join(' &nbsp; ')+`</div>
    <div class="legend"><span><span class="sw" style="background:#C2410C;height:9px;border:1.5px solid #1F2A37"></span>${t.heavy}</span><span><span class="sw" style="background:#0F766E;height:4px"></span>${t.light}</span></div>
    <div class="mols">`+[0,1,2,3,4].map(g=>`<div class="molcol"><b>G${g}</b><br>${molSVG(S.mol,g)}</div>`).join('')+`</div></details></section>`;
  if(P()){
    h+=`<section class="card"><details id="tdet" ${S.tOpen?'open':''}><summary>${t.teacher}</summary><p class="note">${t.teacherP}</p><div class="row" role="radiogroup">`+
      MODELS.map(m=>`<label><input type="radio" name="world" id="w-${m}" value="${m}" ${S.world===m?'checked':''}> ${t.names[m]}</label>`).join(' &nbsp; ')+`</div></details></section>`;
  }else{
    h+=`<section class="card"><h2>${t.h5}</h2>`;
    if(!rev().length)h+=`<p>${t.sumEmpty}</p>`;
    else{
      h+=`<table><tr><th>${t.colSample}</th><th>${t.colBands}</th><th>${t.colHyp}</th><th>${t.colJ}</th><th>${t.colRes}</th></tr>`+
        rev().map(s=>{const cm=compat(s);return `<tr><td>${sLabel(s)}</td><td>${descBands(observe(S.world,s.gen,s.heated))} ${t.rho}</td><td>${s.hyp?t.names[s.hyp]:'—'}</td><td>${esc(s.just||'')}</td><td>${cm.length?cm.map(m=>t.names[m]).join(', '):t.none}</td></tr>`;}).join('')+`</table>`+
        `<textarea id="sumtxt" readonly rows="6" style="margin-top:12px" aria-label="${t.h5}">${esc(summaryText())}</textarea>
        <div class="row"><button class="btn" id="copy">${t.copy}</button><span class="note" id="copymsg" aria-live="polite"></span></div><p class="note">${t.printTip}</p>`;
    }
    h+=`</section><section class="card" id="quiz"><h2>${t.h6}</h2>`;
    if(!(rev().length&&alive.length===1))h+=`<p>${t.quizLock}</p>`;
    else h+=t.quiz.map((q,n)=>{const a=S.quiz[n];
      return `<fieldset class="q"><legend><b>${n+1}.</b> ${q.q}</legend>`+q.opts.map((o,k)=>`<label class="opt"><input type="radio" name="q${n}" id="q${n}-${k}" value="${k}" ${a===k?'checked':''}> ${o}</label>`).join('')+
        (a===undefined?'':a===q.ok?`<div class="fb fbok"><b>${t.correct}</b> ${q.fb}</div>`:`<div class="fb fbno"><b>${t.retry}</b> ${t.hintL}: ${q.hint}</div>`)+`</fieldset>`;}).join('');
    h+=`</section>`;
  }
  h+=footer(t);
  app.innerHTML=h;
  app.querySelectorAll('canvas[data-ref]').forEach(cv=>{const r=refs.find(r=>r.id===cv.dataset.ref);draw(cv,{bands:r.bands,kind:'full',heated:!!r.heated});});
  app.querySelectorAll('canvas[data-c]').forEach(cv=>{const s=S.samples[+cv.dataset.c],k=cv.dataset.kind;
    draw(cv,{bands:k==='strip0'?[]:observe(S.world,s.gen,s.heated),kind:k==='full'?'full':'strip',heated:s.heated,marks:s.marks});});
  app.querySelectorAll('canvas[data-p]').forEach(cv=>{const [i,m]=cv.dataset.p.split('|');const s=S.samples[+i];draw(cv,{bands:predict(m,s.gen,s.heated),kind:'mini',heated:s.heated});});
  if(act){const e=document.getElementById(act);if(e){e.focus();if(sel&&e.setSelectionRange)e.setSelectionRange(sel[0],sel[1]);}}
  save();startTick();
}
function footer(t){
  return `<footer><p>${t.sim}</p><p><b>${t.src}:</b> Meselson, M. y Stahl, F. W. (1958). <i>The replication of DNA in Escherichia coli</i>. PNAS 44(7): 671–682, <a href="https://doi.org/10.1073/pnas.44.7.671" target="_blank" rel="noopener">doi:10.1073/pnas.44.7.671</a> · <a href="https://en.wikipedia.org/wiki/Meselson%E2%80%93Stahl_experiment" target="_blank" rel="noopener">Wikipedia: Meselson–Stahl experiment</a>.</p></footer>`;
}

let tk=null;
function startTick(){if(tk||S.mode!=='ind'||!S.samples.some(s=>waitLeft(s)>0))return;tk=setTimeout(tick,500);}
function tick(){tk=null;S.samples.forEach((s,i)=>{if(s.stage!==0)return;const g=gate(s),cd=document.getElementById('cd'+i),b=document.getElementById('adv'+i);if(cd)cd.textContent=g.msg;if(b)b.disabled=g.dis;});startTick();}

const app=document.getElementById('app');
app.addEventListener('click',(e)=>{
  const cv=e.target.closest('canvas.mk');
  if(cv){const s=S.samples[+cv.dataset.c];if(!s||s.stage!==0)return;
    const r=cv.getBoundingClientRect(),W=cv.clientWidth,pad=10,rho=RMIN+(e.clientX-r.left-pad)/(W-2*pad)*(RMAX-RMIN);
    const tol=(RMAX-RMIN)*16/W,k=s.marks.findIndex(m=>Math.abs(m-rho)<tol);
    if(k>=0)s.marks.splice(k,1);else if(s.marks.length<(P()?8:3))s.marks.push(Math.min(RMAX,Math.max(RMIN,rho)));
    render();return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.lang){S.lang=b.dataset.lang;try{localStorage.setItem(LKEY,S.lang);}catch(err){}render();}
  else if(b.dataset.mode){S.mode=b.dataset.mode;S.world='semi';S.async=false;resetExp();if(S.mode==='ind')load();render();window.scrollTo(0,0);}
  else if(b.id==='chmode'){S.mode=null;render();window.scrollTo(0,0);}
  else if(b.id==='reset'){resetExp();if(S.mode==='ind'){try{localStorage.removeItem(KEY);}catch(err){}}render();}
  else if(b.id==='next'&&S.gen<4){S.gen=Math.min(4,Math.round((S.gen+(S.async?0.5:1))*10)/10);render();}
  else if(b.id==='spin'){
    if(!S.samples.some(s=>s.gen===S.gen&&s.heated===S.heat)){S.samples.push({gen:S.gen,heated:S.heat,stage:0,marks:[],t0:Date.now(),hyp:null,just:'',votes:{semi:0,cons:0,disp:0}});S.samples.sort((a,c)=>a.gen-c.gen||(a.heated-c.heated));}
    render();}
  else if(b.dataset.adv!==undefined){const s=S.samples[+b.dataset.adv];if(s&&!gate(s).dis&&s.stage<4){s.stage++;render();}}
  else if(b.dataset.rm!==undefined){S.samples.splice(+b.dataset.rm,1);render();}
  else if(b.dataset.vote){const [i,m,d]=b.dataset.vote.split('|');const s=S.samples[+i];s.votes[m]=Math.max(0,s.votes[m]+(+d));render();}
  else if(b.id==='copy'){
    const ta=document.getElementById('sumtxt'),msg=document.getElementById('copymsg'),t=T();
    const fallback=()=>{ta.focus();ta.select();msg.textContent=t.copyFail;};
    try{navigator.clipboard.writeText(ta.value).then(()=>{msg.textContent=t.copied;},fallback);}catch(err){fallback();}
  }
});
app.addEventListener('change',(e)=>{
  const el=e.target;
  if(el.dataset.j!==undefined){const s=S.samples[+el.dataset.j];if(s){s.just=el.value;save();}return;}
  if(el.id==='heat')S.heat=el.checked;
  else if(el.id==='async'){S.async=el.checked;resetExp();}
  else if(el.name==='mol')S.mol=el.value;
  else if(el.name==='world'){S.world=el.value;resetExp();}
  else if(el.dataset.i!==undefined){S.samples[+el.dataset.i].hyp=el.value;}
  else if(/^q\d+$/.test(el.name)){S.quiz[+el.name.slice(1)]=+el.value;}
  render();
});
app.addEventListener('input',(e)=>{const el=e.target;if(el.dataset&&el.dataset.j!==undefined){const s=S.samples[+el.dataset.j];if(s){s.just=el.value;save();}}});
app.addEventListener('toggle',(e)=>{const el=e.target;if(el.id==='tdet')S.tOpen=el.open;else if(el.id==='mdet')S.mOpen=el.open;else if(el.dataset&&el.dataset.k)S.openDone[el.dataset.k]=el.open;},true);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150);});
render();
</script>
</body>
</html>
